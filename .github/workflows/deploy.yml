name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts + D1 + Queues edit) and
      # CLOUDFLARE_ACCOUNT_ID. CLERK_SECRET_KEY is a Worker secret, set once with
      # `wrangler secret put CLERK_SECRET_KEY`. The D1 database id and the queues are
      # created once by hand (see README) and recorded in wrangler.jsonc.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply dog-walking --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
